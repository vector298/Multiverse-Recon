name: Deploy Multiverse Recon to GitHub Pages

# Deploys the static site to GitHub Pages.
# One-time setup: in the repository, go to
#   Settings → Pages → Build and deployment → Source → "GitHub Actions".
# After that, every push to the branches below publishes the game.

on:
  push:
    branches:
      - main
      - master
      - claude/epic-brown-broser
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (index.html at the root).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
